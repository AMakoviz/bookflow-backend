spring:
  application:
    name: bookflow
  datasource:
    url: ${BOOKFLOW_DB_URL:jdbc:postgresql://localhost:5432/bookflow}
    username: ${BOOKFLOW_DB_USER:bookflow}
    password: ${BOOKFLOW_DB_PASSWORD:bookflow}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

bookflow:
  office-zone: Europe/Moscow

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
